<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f4fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c18" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Oratio" />
    <meta name="description" content="Oratio: liturgia do dia, terço, orações e novenas." />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Oratio</title>
    <script>
      // aplica o tema salvo antes da primeira pintura (evita piscar)
      try {
        var t = localStorage.getItem('oratio-theme')
        if (t && t !== 'auto') document.documentElement.dataset.theme = t
        var f = parseFloat(localStorage.getItem('oratio-font') || '1')
        if (f >= 0.8 && f <= 1.6) document.documentElement.style.setProperty('--font-scale', String(f))
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
